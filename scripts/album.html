<title>{{title}}</title>
<meta name="color-scheme" content="dark">
<style>
  :root{ --bg:#0d0d0e; --fg:#e9e7e4; --dim:#8c8a87; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  a{color:#b8b5b1;text-decoration:none;border-bottom:1px solid #3a3a3c}

  /* ------------------------------- album grid ------------------------------- */
  #hdr{padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 12px;position:sticky;top:0;z-index:5;
    background:linear-gradient(#0d0d0e 70%,rgba(13,13,14,.88) 86%,rgba(13,13,14,0));backdrop-filter:blur(8px)}
  #hdr h1{margin:0 0 3px;font-size:21px;font-weight:700}
  #roll{margin:0;color:var(--dim);font-size:12.5px}
  #bar{display:flex;gap:16px;align-items:center;margin-top:9px;font-size:12.5px;color:var(--dim);flex-wrap:wrap}
  #grid{display:grid;gap:2px;padding:0 2px calc(env(safe-area-inset-bottom,0px) + 40px);
    grid-template-columns:repeat(3,1fr)}
  @media(min-width:640px){#grid{grid-template-columns:repeat(5,1fr);gap:3px;padding:0 3px 60px}}
  @media(min-width:1100px){#grid{grid-template-columns:repeat(8,1fr)}}
  .cell{position:relative;aspect-ratio:1;overflow:hidden;background:#1a1a1b;padding:0}
  .cell img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
  .cell img.on{opacity:1}
  .cell:active img{filter:brightness(.7)}
  .cell.sel{outline:2px solid #e9e7e4;outline-offset:-2px}
  .cell .bad{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:#e0685f}
  #foot{padding:0 16px calc(env(safe-area-inset-bottom,0px) + 34px);color:#6f6d6a;font-size:11.5px;line-height:1.65}

  /* ------------------------------ full-screen viewer ------------------------------ */
  #viewer{position:fixed;inset:0;z-index:40;display:none;background:#000;touch-action:none;overscroll-behavior:none}
  #viewer.on{display:block}
  #vbg{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .3s}
  #vwrap{position:absolute;inset:0;will-change:transform}
  #strip{position:absolute;top:0;left:0;height:100%;display:flex;will-change:transform}
  .page{position:relative;width:100vw;height:100vh;flex:0 0 100vw;display:grid;place-items:center;overflow:hidden}
  .page img{grid-area:1/1;max-width:100%;max-height:100%;width:auto;height:auto;
    will-change:transform;user-select:none;-webkit-user-drag:none;opacity:0;transition:opacity .18s}
  .page img.on{opacity:1}
  .page img.b{display:none;z-index:2}

  #ctop,#cbot{position:absolute;left:0;right:0;z-index:12;display:flex;align-items:center;gap:12px;
    padding:10px 14px;color:#f2f0ee;opacity:0;transition:opacity .25s;pointer-events:none}
  #ctop{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,0))}
  #cbot{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);justify-content:space-between;
    background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.72))}
  #viewer.chrome #ctop,#viewer.chrome #cbot{opacity:1;pointer-events:auto}
  #ctop .ico{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(60,60,62,.55);font-size:20px}
  #counter{font-size:13px;color:#dcdad7}
  #cmpBtn{margin-left:auto;font-size:12.5px;padding:6px 12px;border-radius:14px;background:rgba(60,60,62,.55)}
  #cmpBtn.act{background:#e9e7e4;color:#141414}
  #info{font-size:12px;color:#c9c6c2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #zoom{font-size:12px;color:#9a9895}
  #clone{position:fixed;z-index:60;display:none;background-color:#000;background-repeat:no-repeat;background-position:center}
</style>

<header id="hdr">
  <h1>{{title}}</h1>
  <p id="roll">{{roll}}</p>
  <div id="bar"><span>{{hint}}</span><a href="compare.html">{{cmp_link}}</a></div>
</header>

<main id="grid"></main>
<p id="foot">{{foot}}</p>

<div id="viewer" aria-label="{{aria}}">
  <div id="vbg"></div>
  <div id="vwrap"><div id="strip">
    <div class="page"><img class="a"><img class="b"></div>
    <div class="page"><img class="a"><img class="b"></div>
    <div class="page"><img class="a"><img class="b"></div>
  </div></div>
  <div id="ctop">
    <button class="ico" id="closeBtn" aria-label="{{close}}">&#8249;</button>
    <div id="counter"></div>
    <button id="cmpBtn">{{compare}}</button>
  </div>
  <div id="cbot"><div id="info"></div><div id="zoom"></div></div>
</div>
<div id="clone"></div>

<script>
const META = /*META*/;
const STR  = /*STR*/;
const EASE = 'cubic-bezier(.32,.72,0,1)';
const $ = s => document.querySelector(s);
const VW = () => window.innerWidth, VH = () => window.innerHeight;
const grid = $('#grid'), viewer = $('#viewer'), vwrap = $('#vwrap'), strip = $('#strip'),
      clone = $('#clone'), pages = [...strip.querySelectorAll('.page')];

let idx = 0, zoom = {s:1,x:0,y:0}, before = false, animating = false, chromeTimer = 0, lastTap = 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash = h => { try{ history.replaceState(null,'', h ? '#'+h : location.pathname); }catch(e){} };

/* ---------------------------------- grid ---------------------------------- */
const cells = [];
META.forEach((p,i) => {
  const b = document.createElement('button');
  b.className = 'cell'; b.dataset.i = i;
  b.innerHTML = `<img alt="${esc(STR.alt_a.replace('{n}',p.n))}">` + (p.ok ? '' : '<i class="bad"></i>');
  const im = b.firstChild;
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    im.src = `img/t/${p.n}.jpg`; im.onload = () => im.classList.add('on'); io.disconnect();
  }), {rootMargin:'400px'});
  io.observe(b);
  b.addEventListener('click', () => open(i, b));
  grid.appendChild(b); cells.push(b);
});

/* the rect photo p occupies on screen (contain fit, centred) */
function fitRect(p){
  const s = Math.min(VW()/p.w, VH()/p.h), w = p.w*s, h = p.h*s;
  return {x:(VW()-w)/2, y:(VH()-h)/2, w, h};
}
/* the largest rect with the photo's aspect that fits inside a grid cell */
function cellRect(p, cell){
  const r = cell.getBoundingClientRect(), s = Math.min(r.width/p.w, r.height/p.h);
  const w = p.w*s, h = p.h*s;
  return {x:r.x+(r.width-w)/2, y:r.y+(r.height-h)/2, w, h};
}
/* the rect the open photo really occupies, zoom included */
function curRect(p){
  const f = fitRect(p), w = f.w*zoom.s, h = f.h*zoom.s;
  return {x:f.x+(f.w-w)/2+zoom.x, y:f.y+(f.h-h)/2+zoom.y, w, h};
}

/* ------------------------------- open / close ------------------------------- */
function open(i, cell){
  if (animating) return;
  idx = i; before = false; setBefore(); resetZoom();
  viewer.classList.add('on');
  setStrip(i);
  const p = META[i], fr = fitRect(p), sr = cellRect(p, cell), cur = pages[1];
  loadSlot(1, p);
  cur.querySelectorAll('img').forEach(im => im.classList.remove('on'));
  $('#vbg').style.opacity = 0;
  clone.style.display = 'block';
  clone.style.backgroundSize = 'cover';
  clone.style.backgroundImage = `url("img/t/${p.n}.jpg")`;
  Object.assign(clone.style, {left:sr.x+'px', top:sr.y+'px', width:sr.w+'px', height:sr.h+'px', opacity:1});
  animating = true;
  const a = cur.querySelector('img.a');
  const reveal = () => {
    if (!viewer.classList.contains('on')) return;
    cur.querySelectorAll('img').forEach(im => im.classList.add('on'));
    clone.animate([{opacity:1},{opacity:0}], {duration:160, fill:'forwards'}).finished
      .then(() => { clone.getAnimations().forEach(x=>x.cancel()); clone.style.display='none'; }).catch(()=>{});
    animating = false;
  };
  clone.animate([{left:sr.x+'px',top:sr.y+'px',width:sr.w+'px',height:sr.h+'px'},
                 {left:fr.x+'px',top:fr.y+'px',width:fr.w+'px',height:fr.h+'px'}],
                {duration:360, easing:EASE, fill:'forwards'}).finished.then(() => {
    $('#vbg').style.opacity = 1;
    if (a.complete && a.naturalWidth) reveal(); else a.addEventListener('load', reveal, {once:true});
  });
  showChrome(); hash(p.n);
}

function close(){
  if (animating) return;
  const p = META[idx], cell = cells[idx];
  cell.scrollIntoView({block:'nearest'});
  const fr = curRect(p), sr = cellRect(p, cell), cur = pages[1];
  cur.querySelectorAll('img').forEach(im => im.classList.remove('on'));
  clone.style.display = 'block';
  clone.style.backgroundSize = '100% 100%';
  clone.style.backgroundImage = `url("img/${before?'b':'a'}/${p.n}.jpg")`;
  Object.assign(clone.style, {left:fr.x+'px', top:fr.y+'px', width:fr.w+'px', height:fr.h+'px', opacity:1});
  $('#vbg').style.opacity = 0;
  animating = true;
  clone.animate([{left:fr.x+'px',top:fr.y+'px',width:fr.w+'px',height:fr.h+'px'},
                 {left:sr.x+'px',top:sr.y+'px',width:sr.w+'px',height:sr.h+'px'}],
                {duration:320, easing:EASE, fill:'forwards'}).finished.then(() => {
    viewer.classList.remove('on');
    clone.getAnimations().forEach(x=>x.cancel());
    clone.style.display = 'none';
    animating = false;
  });
  hash('');
}

/* --------------------------------- the strip --------------------------------- */
function setStrip(i){
  strip.style.transition = 'none';
  strip.style.transform = 'translateX(-100vw)';
  vwrap.style.transition = ''; vwrap.style.transform = ''; vwrap.style.opacity = 1;
  $('#vbg').style.opacity = 1;
  for (let k=0;k<3;k++){
    const j = i-1+k, pg = pages[k];
    pg.querySelectorAll('img').forEach(im => { im.classList.remove('on'); im.removeAttribute('src'); });
    if (j >= 0 && j < META.length) loadSlot(k, META[j]);
  }
}
function loadSlot(k, p){
  const pg = pages[k];
  pg.querySelector('img.a').src = `img/a/${p.n}.jpg`;
  pg.querySelector('img.b').src = `img/b/${p.n}.jpg`;
  pg.querySelectorAll('img').forEach(im => {
    if (im.complete && im.naturalWidth) im.classList.add('on');
    else im.addEventListener('load', () => im.classList.add('on'), {once:true});
  });
  if (k === 1) applyZoom();
}
function go(i){
  if (i < 0 || i >= META.length) return;
  idx = i; resetZoom(); setStrip(i); showChrome(); hash(META[i].n);
}

/* ----------------------------------- zoom ----------------------------------- */
function applyZoom(){
  pages[1].querySelectorAll('img').forEach(x =>
    x.style.transform = `translate(${zoom.x}px,${zoom.y}px) scale(${zoom.s})`);
  $('#zoom').textContent = zoom.s > 1.02 ? Math.round(zoom.s*100)+'%' : '';
}
function resetZoom(){ zoom = {s:1,x:0,y:0}; applyZoom(); }
function clampPan(){
  const f = fitRect(META[idx]), s = zoom.s;
  const mx = Math.max(0,(f.w*s-f.w)/2), my = Math.max(0,(f.h*s-f.h)/2);
  zoom.x = Math.max(-mx, Math.min(mx, zoom.x));
  zoom.y = Math.max(-my, Math.min(my, zoom.y));
}
function zoomAt(cx, cy, ns){
  ns = Math.max(1, Math.min(5, ns));
  const f = fitRect(META[idx]);
  const ox = cx-(f.x+f.w/2), oy = cy-(f.y+f.h/2), k = ns/zoom.s;
  zoom.x = ox - k*(ox-zoom.x); zoom.y = oy - k*(oy-zoom.y); zoom.s = ns;
  if (zoom.s === 1){ zoom.x = zoom.y = 0; } else clampPan();
  applyZoom(); showChrome();
}

/* ------------------------------- before / after ------------------------------- */
function setBefore(){
  pages.forEach(pg => { pg.querySelector('img.b').style.display = before ? 'block' : 'none'; });
  $('#cmpBtn').classList.toggle('act', before);
}
$('#cmpBtn').addEventListener('click', e => { e.stopPropagation(); before = !before; setBefore(); showChrome(); });

/* ------------------------------- chrome + info ------------------------------- */
function showChrome(){
  viewer.classList.add('chrome');
  clearTimeout(chromeTimer);
  chromeTimer = setTimeout(() => viewer.classList.remove('chrome'), 2800);
  const p = META[idx], bits = [p.n];
  if (p.cls) bits.push(STR.cls[p.cls]);
  if (p.ev) bits.push((p.ev>0?'+':'')+p.ev.toFixed(2)+' EV');
  if (p.spot) bits.push(STR.spot);
  if (p.capped) bits.push(STR.capped);
  if (before) bits.push(STR.before);
  $('#counter').textContent = `${idx+1} / ${META.length}`;
  $('#info').textContent = bits.join(' · ');
  $('#zoom').textContent = zoom.s > 1.02 ? Math.round(zoom.s*100)+'%' : '';
}

/* --------------------------------- gestures --------------------------------- */
const ptrs = new Map();
let mode = null, dx = 0, dy = 0, sx = 0, sy = 0, st = 0, pinch0 = 1, dist0 = 0;

viewer.addEventListener('pointerdown', e => {
  if (animating) return;
  if (e.target.closest('#ctop,#cbot')) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    mode = 'pinch'; dist0 = Math.hypot(a.x-b.x, a.y-b.y); pinch0 = zoom.s; return;
  }
  mode = zoom.s > 1.02 ? 'pan' : 'page';
  sx = e.clientX; sy = e.clientY; st = performance.now(); dx = dy = 0;
});
viewer.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (mode === 'pinch' && ptrs.size === 2){
    const [a,b] = [...ptrs.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
    zoomAt((a.x+b.x)/2, (a.y+b.y)/2, pinch0*d/dist0); return;
  }
  dx = e.clientX-sx; dy = e.clientY-sy;
  if (mode === 'pan'){ zoom.x += e.clientX-prev.x; zoom.y += e.clientY-prev.y; clampPan(); applyZoom(); }
  else if (mode === 'page'){
    if (Math.abs(dx) > Math.abs(dy)){
      strip.style.transition = 'none';
      strip.style.transform = `translateX(${-VW()+dx}px)`;
    } else {
      vwrap.style.transition = 'none';
      vwrap.style.transform = `translateY(${dy}px) scale(${Math.max(.92, 1-Math.abs(dy)/2400)})`;
      $('#vbg').style.opacity = Math.max(0, 1-Math.abs(dy)/420);
    }
  }
});
function endPointer(e){
  ptrs.delete(e.pointerId);
  if (mode === 'pinch'){ if (ptrs.size < 2) mode = null; return; }
  if (!mode) return;
  const m = mode; mode = null;
  const dt = Math.max(1, performance.now()-st);

  if (m === 'page' && Math.abs(dx) > Math.abs(dy)){
    const fast = Math.abs(dx)/dt > .55;
    if ((dx < -VW()/4 || (dx < -40 && fast)) && idx < META.length-1) swipeTo(1);
    else if ((dx > VW()/4 || (dx > 40 && fast)) && idx > 0) swipeTo(-1);
    else snap();
  } else if (m === 'page' && Math.abs(dy) > 110){
    close();
  } else if (m === 'page' && Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 320){
    const t = performance.now();
    if (t - lastTap < 320){                       // double tap = zoom in / out
      zoomAt(e.clientX, e.clientY, zoom.s > 1.02 ? 1 : 2.6);
      lastTap = 0;
    } else {
      lastTap = t;
      setTimeout(() => { if (lastTap === t) viewer.classList.toggle('chrome'); }, 230);
    }
  }
}
viewer.addEventListener('pointerup', endPointer);
viewer.addEventListener('pointercancel', endPointer);

function swipeTo(dir){
  strip.style.transition = `transform .3s ${EASE}`;
  strip.style.transform = `translateX(${-VW()+dx+dir*VW()}px)`;
  setTimeout(() => go(idx+dir), 290);
}
function snap(){
  strip.style.transition = `transform .28s ${EASE}`;
  strip.style.transform = 'translateX(-100vw)';
  vwrap.style.transition = `transform .28s ${EASE}`;
  vwrap.style.transform = ''; $('#vbg').style.opacity = 1;
  setTimeout(() => { vwrap.style.transition = ''; }, 300);
}

$('#closeBtn').addEventListener('click', e => { e.stopPropagation(); close(); });
viewer.addEventListener('wheel', e => { if (animating) return; e.preventDefault();
  zoomAt(e.clientX, e.clientY, zoom.s*Math.exp(-e.deltaY*0.0016)); }, {passive:false});
addEventListener('resize', () => { if (viewer.classList.contains('on')) resetZoom(); });

/* --------------------------------- keyboard --------------------------------- */
addEventListener('keydown', e => {
  if (!viewer.classList.contains('on')){
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      idx = Math.max(0, Math.min(META.length-1, idx + (e.key === 'ArrowRight' ? 1 : -1)));
      cells.forEach(c => c.classList.remove('sel'));
      cells[idx].classList.add('sel'); cells[idx].scrollIntoView({block:'nearest'});
      e.preventDefault();
    } else if (e.key === 'Enter' || e.key === ' '){ open(idx, cells[idx]); e.preventDefault(); }
    return;
  }
  if (e.key === 'Escape') close();
  else if (e.key === 'ArrowRight') go(Math.min(META.length-1, idx+1));
  else if (e.key === 'ArrowLeft')  go(Math.max(0, idx-1));
  else if (e.key === 'b' || e.key === 'B'){ before = !before; setBefore(); showChrome(); }
  else if (e.key === '+' || e.key === '=') zoomAt(VW()/2, VH()/2, zoom.s*1.35);
  else if (e.key === '-') zoomAt(VW()/2, VH()/2, zoom.s/1.35);
  else if (e.key === '0') resetZoom();
});

/* #DSC05011 opens straight into that frame */
const h0 = decodeURIComponent(location.hash.slice(1));
if (h0){
  const j = META.findIndex(p => p.n === h0);
  if (j >= 0){ cells[j].scrollIntoView({block:'center'}); requestAnimationFrame(() => open(j, cells[j])); }
}
</script>
